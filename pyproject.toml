[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "paymobx"
version = "1.1.0"
authors = [
  { name = "ahmhesham", email = "contact.ahmhesham@gmail.com" },
]
description = "A professional, internationally-ready Python client for the Paymob payment gateway — Intention API, Unified Checkout, Fawry/Kiosk, and legacy Order flow."
readme = "README.md"
requires-python = ">=3.7"
license = { text = "MIT" }
keywords = [
    "paymob",
    "payments",
    "payment-gateway",
    "egypt",
    "fawry",
    "kiosk",
    "unified-checkout",
    "intention-api",
    "django",
    "paymobx",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Framework :: Django",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.25",
]

[project.optional-dependencies]
django = ["django>=3.2"]

[project.urls]
Homepage = "https://github.com/ahmhesham/paymobx"
Source = "https://github.com/ahmhesham/paymobx"
Issues = "https://github.com/ahmhesham/paymobx/issues"
Changelog = "https://github.com/ahmhesham/paymobx/blob/main/README.md#changelog"

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["."]
include = ["paymobx*"]